<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#161c30" />
  <meta name="description" content="Track habits and symptoms, then find which ones actually affect how you feel. Plotline runs real statistics on your own log - private, offline-first, and with every finding explained in plain language." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plotline" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <title>Plotline: Track & Find Trends</title>
</head>
<body>
  <div class="app-shell">
    <div class="statusbar-pad"></div>
    <header class="app-header">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="title" id="appTitle">Plotline<span class="sync-pill" id="syncPill" style="display:none;"></span></div>
      <button class="icon-btn" id="exportBtn" aria-label="Export" title="Export JSON">⬇</button>
      <button class="icon-btn" id="addBtn" aria-label="Add event">＋</button>
    </header>

    <nav class="app-tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-view="categories" aria-selected="true">Categories</button>
      <button class="tab" role="tab" data-view="recent"     aria-selected="false">Recent</button>
      <button class="tab" role="tab" data-view="day"        aria-selected="false">Day</button>
      <button class="tab" role="tab" data-view="stats"      aria-selected="false">Statistics</button>
      <button class="tab" role="tab" data-view="insights"   aria-selected="false">Insights</button>
    </nav>

    <main class="app-main" id="main" aria-live="polite">
      <!-- views injected here -->
    </main>

    <button class="fab" id="fab" aria-label="Add event">＋</button>
  </div>

  <!-- Drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="scrim" data-close></div>
    <aside class="panel" role="navigation">
      <header>
        <div class="app-name">Plotline</div>
        <div class="app-sub">Count what happens, know when</div>
      </header>
      <nav>
        <div class="section">Data</div>
        <button id="navImport">📥 Import JSON…</button>
        <button id="navExport">💾 Export JSON</button>
        <button id="navExportCsv">📊 Export CSV (for Sheets/Excel)</button>
        <button id="navBackup">🛟 Save safety backup</button>
        <div class="section">Setup</div>
        <button id="navTopics">🗂 Manage topics</button>
        <button id="navQuickBar">⚡ Quick-access bar…</button>
        <button id="navRoles">🩺 Insights setup…</button>
        <button id="navAlerts">🔔 Status alerts…</button>
        <button id="navDrive">☁️ Google Drive sync…</button>
        <div class="section">App</div>
        <button id="navAbout">ℹ️ About</button>
        <button id="navStorage">💽 Storage status</button>
        <a class="drawer-link" href="/privacy.html" target="_blank" rel="noopener">🔒 Privacy policy</a>
        <div class="section">Danger zone</div>
        <button id="navWipe" class="danger">🗑 Wipe all local data…</button>
      </nav>
      <div class="drawer-version" id="drawerVersion">—</div>
    </aside>
  </div>

  <!-- Modal container -->
  <div id="modalRoot"></div>

  <!-- Snackbar -->
  <div class="snackbar" id="snackbar" role="status"></div>

  <!-- Hidden file input for import -->
  <input type="file" id="fileInput" accept="application/json,.json" hidden />

  <!-- Scripts -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/import-export.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/insights.js"></script>
  <script src="/js/goals.js"></script>
  <script src="/js/drive.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
